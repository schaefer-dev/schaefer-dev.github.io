- id: branchboard
  title: "Branchboard"
  tags: [Rust, TypeScript, Tauri, Svelte]
  image: /assets/projects/branchboard.png
  image_fit: contain
  image_alt: "Branchboard: repositories, agent states, branches and a Git diff beside a herdr terminal"
  repo: https://github.com/schaefer-dev/branchboard
  featured: true
  summary: >-
    Desktop app for reviewing what coding agents build across multiple repositories,
    with Git diffs, branch comparisons and an embedded herdr terminal.
  description: |
    Working with coding agents across several repositories means keeping track of which agents need input and reviewing the changes they leave behind. Branchboard brings that workflow into one desktop window on macOS and Windows. Repositories can be grouped and pinned, while agent states from herdr show who is working, blocked or done. An embedded herdr terminal sits beside syntax-highlighted Git diffs, so I can move between an agent and its changes without switching apps. Files can be staged or unstaged, branches compared against a configurable mainline and commits inspected before switching branches. Built with Tauri 2, Rust, Svelte 5 and TypeScript, Branchboard uses the installed Git CLI and also works as a multi-repository Git GUI without herdr. The app is in active development, with installers available through GitHub Releases.

- id: wearwise
  title: "WearWise"
  tags: [Swift, SwiftUI, SwiftData, CloudKit]
  image: /assets/projects/wearwise.jpg
  image_alt: "WearWise on iPhone and Mac: the What to Wear screen next to a logged hike with its outfit and weather"
  featured: true
  summary: >-
    Native iPhone and Mac app that suggests what to wear outdoors, based on what
    kept me comfortable in similar weather before.
  description: |
    Weather forecasts tell you the temperature, but not that you personally run cold below 8 °C in the wind. WearWise is a native iPhone and Mac app built with SwiftUI and SwiftData that logs what I wore on a hike, run or ride together with the weather conditions and how comfortable I was, rated separately per body zone on a thermal scale. Before heading out, "What to Wear" ranks past outings by how similar the conditions were and how comfortable I felt, and suggests the outfit that worked. Outings can be started from Apple Health workouts, wardrobe and history sync across devices via CloudKit, and everything can be exported to a portable JSON file. The app is planned to be published soon.

- id: morrow
  title: "Morrow"
  tags: [Swift, AppKit, UIKit, CloudKit]
  image: /assets/projects/morrow.jpg
  image_alt: "Morrow: the calm, native to-do app for Mac and iPhone, built with AppKit, UIKit and iCloud sync"
  summary: >-
    A calm, native to-do app for Mac and iPhone with private, end-to-end
    encrypted iCloud sync.
  description: |
    Morrow is my personal task manager, built to feel quiet, fast and truly native: pure AppKit on the Mac and UIKit on iPhone, with no web views or cross-platform layers, on top of a shared Swift 6 core. Data lives locally in SQLite via GRDB, every change can be undone, and dates can be typed the way you say them ("next fri", "in 3 days"). Mac and iPhone sync through a custom, platform-independent sync engine with field-level merging on top of CloudKit's `CKSyncEngine`, verified by deterministic convergence simulations on every change. Things 3 import and an opt-in Obsidian integration round it off, and an App Store release for Mac and iPhone is planned.

- id: supernote-viewer
  title: "Sumi for Supernote"
  tags: [Swift, SwiftUI, AppKit, Vision]
  image: /assets/projects/sumi.jpg
  image_alt: "Sumi for Supernote: a handwritten notebook on Mac and a marked-up PDF on iPhone, with Quick Look, searchable handwriting, Dropbox library and live reload"
  repo: https://github.com/schaefer-dev/supernote-viewer
  link: /sumi/
  link_text: "Sumi on iPhone and iPad"
  featured: true
  summary: >-
    Native Mac, iPhone and iPad apps that open, preview and search handwritten
    Supernote notebooks like any other PDF.
  description: |
    My Supernote e-ink tablet syncs `.note` notebooks and `.pdf.mark` annotations, but neither macOS nor iOS can open them. Sumi for Supernote makes these files feel native on all my Apple devices. Under the hood a shared Swift package parses the proprietary file format, decodes the layer bitmaps and renders handwriting as crisp vector strokes from the notebook's own pen data. Apple's on-device Vision text recognition adds an invisible text layer, so handwriting becomes searchable and copyable, and titles marked on the device become a table of contents.

    On the Mac, notebooks open with a double-click, either in Sumi's own window or as generated PDFs in Apple's Preview, and preview with Space through a Quick Look extension. Sumi's window additionally supports live reload while writing on the device and a calibrated measuring tool for floor plans. On iPhone and iPad, a SwiftUI app reads the Supernote library from Dropbox with read-only access, keeps it available offline, and adds handwriting search, page titles, bookmarks, favorites and PDF export. There are no accounts and no tracking, everything is rendered on the device, Mac releases are shipped as signed and notarized DMGs, and the iOS app is [heading to the App Store](/sumi/).

- id: bird-radar
  title: "Bird Radar"
  tags: [Python, FastAPI, SQLAlchemy, MCP]
  image: /assets/projects/bird-radar.webp
  image_alt: "Bird Radar: a teal radar sweep over glowing sighting markers and contour lines, with the tagline Discover what you haven't seen yet"
  summary: >-
    Local-first sighting tracker that consolidates public bird observations,
    flags species I haven't seen yet and plans my field days.
  description: |
    Interesting bird sightings are scattered across several public observation platforms, each with its own coverage, data format and rate limits. Bird Radar normalizes bird and mammal observations from these sources into a single local-first database. Aggressive caching and per-source throttling keep the load on these community services minimal. Sightings are matched against my personal life list and wishlist to surface species I have not yet observed, combined with a reviewed rarity catalog. Getting rarity detection right required careful reverse engineering, for example reading the per-observation rarity colour instead of misleading atlas category icons. A mobile-friendly FastAPI web UI with a daily field plan, map views with marker clustering and a coverage view for planning historical backfills runs on a Raspberry Pi reachable via Tailscale. An MCP server additionally gives Claude read-only access to the data, so I can plan birding trips in natural language. The project is backed by SQLAlchemy and an extensive pytest suite.

- id: local-ai-assistant
  title: "Local AI Assistant with Hermes Agent"
  tags: [Hermes Agent, Qwen, MCP, Local LLMs]
  image: /assets/projects/local-ai-assistant.webp
  image_alt: "Local AI Assistant with Hermes Agent: a flat teal chat symbol connected to mail, notes, tasks and cycling icons on a dark background"
  summary: >-
    A personal assistant on locally hosted Qwen models that organizes mail,
    notes and todos, with all data under my own control.
  description: |
    To keep personal data under my own control, I run a Hermes agent on locally hosted Qwen models as my personal assistant. It organizes my mails, takes down notes and keeps track of todos. Integrations are provided through various MCP servers, for example for Gmail, iCloud and intervals.icu, which I use for performance tracking and training plans. The project is a playground to explore how far local models can be pushed for agentic everyday tasks, and the learnings feed directly back into my professional work with LLM agents.

- id: karoo-decoupling
  title: "Karoo Aerobic Decoupling Extension"
  tags: [Kotlin, Android, Compose, Karoo SDK]
  image: /assets/projects/karoo-decoupling.jpg
  image_alt: "Karoo Decoupling: live aerobic decoupling and W' balance data fields on a Hammerhead Karoo"
  repo: https://github.com/schaefer-dev/karoo-decoupling
  featured: true
  summary: >-
    Bike computer extension that shows live aerobic decoupling and W′ balance
    while riding.
  description: |
    An extension for the Hammerhead Karoo 2 and Karoo 3 bike computers that displays live aerobic decoupling (Pa:Hr drift) while riding. It samples power and heart rate once per second of moving time, compares the efficiency factor of the first and second half of the ride and shows the running drift percentage as a training and pacing signal. Additional data fields visualize the decoupling trend of the last 60 minutes as a graph and show W′ balance to track remaining anaerobic capacity. To save battery, release builds throttle redraws while the calculation still uses every sample. The math and stream coordination are covered by JVM unit tests, so most bugs are caught without a device.

- id: karoo-intervals
  title: "Karoo Intervals"
  tags: [Kotlin, Android, Karoo SDK, intervals.icu]
  image: /assets/projects/karoo-intervals.jpg
  image_alt: "Karoo Intervals: a full-page intervals.icu workout screen on a Hammerhead Karoo in light and dark mode"
  repo: https://github.com/schaefer-dev/karoo-intervals
  summary: >-
    Runs my planned intervals.icu workouts on a full-page Karoo screen
    designed to be read at a glance mid-interval.
  description: |
    I plan my structured training in intervals.icu, but the Karoo had no good way to ride those workouts. This extension syncs FTP, power zones and every planned ride workout of the coming week and shows them on a dedicated full-page workout screen. Live power is colored against the interval target, next to the time left, the lap average, a preview of the next step and the whole workout profile with a position marker. Interval changes are announced with 3-2-1 beeps and an in-ride alert, and an automatic lap is recorded per interval. The workout follows Karoo's ride clock, so auto-pause and manual pause also pause the workout, and the sync was designed around the 100 KB response limit of the Karoo's network proxy. A built-in simulator in debug builds allows testing whole workouts at 5× speed without riding.

- id: karoo-rpe
  title: "Karoo Ride Rating (RPE)"
  tags: [Kotlin, Android, Karoo SDK, FIT]
  image: /assets/projects/karoo-rpe.jpg
  image_alt: "Ride Rating: an RPE and Feel picker on a Hammerhead Karoo that syncs to intervals.icu"
  repo: https://github.com/schaefer-dev/karoo-rpe
  summary: >-
    Adds the "How hard was that ride?" RPE and Feel rating to the Karoo and
    puts it on my intervals.icu activity.
  description: |
    Garmin head units ask how hard a ride felt and training platforms use that rating for load and fatigue tracking, but the Karoo has no such prompt. This extension adds an in-ride rating field and a prompt on manual pause to pick RPE (1–10) and Feel. The rating is written into the FIT file as developer fields using Garmin's names and scales. While building it I found that current Karoo firmware drops the information needed for platforms to import these fields and [reported it upstream](https://github.com/hammerheadnav/karoo-ext/issues/94). As a workaround, the extension waits for the ride to appear on intervals.icu, matches the activity and sets the rating through the API, retrying with exponential backoff over the Karoo's own connection, so no phone app is needed. The rating and sync logic is kept pure and covered by unit tests.

- id: ridestack
  title: "Ride Stack"
  tags: [TypeScript, React, SQLite, Leaflet]
  image: /assets/projects/ridestack.webp
  image_alt: "Ride Stack: Every ride. One map. Self-hosted cycling archive with Garmin and Hammerhead sync, route grouping and a personal heatmap"
  repo: https://github.com/schaefer-dev/ridestack
  summary: >-
    Self-hosted cycling archive with Garmin and Karoo sync, automatic route
    grouping and a personal heatmap.
  description: |
    Ride Stack brings my road, gravel and MTB rides into one self-hosted archive. It syncs rides from Garmin Connect and Hammerhead Karoo or imports GPX and FIT files, linking duplicate recordings from different sources to the same ride. Rides that follow the same path are grouped into routes automatically, so I can see how often I ride a loop and compare my times. An interactive heatmap can be filtered by bike type, and clicking any location lists every ride that passed it. Road and trail sections can be rated and tagged with surface conditions to help plan future rides. Built with TypeScript, React, Leaflet, Node.js, Express and SQLite, it keeps the database and original files on my own machine and is light enough to run on a Raspberry Pi.

- id: training-platform
  title: "Training Platform"
  tags: [Swift, SwiftUI, GRDB, FIT]
  cover:
    - "Fitness & fatigue"
    - "Power-duration models"
    - "Native macOS · local-first"
  summary: >-
    Native, local-first macOS app for analysing my cycling training, from
    fitness and fatigue to power-duration modelling.
  description: |
    An early-stage training analysis app for a self-coached endurance athlete, with a calendar, fitness and fatigue charts, power curves, power-duration model fitting and detailed activity analysis. All metrics are computed on the device from raw data streams, imported through a dependency-free FIT decoder or synced from intervals.icu, and every formula is documented. A developer tool generates synthetic multi-year datasets for benchmarks and validates the computed metrics against intervals.icu.

- id: obsidian-pdf-mirror
  title: "Obsidian PDF Mirror"
  tags: [Python, pandoc, Typst, Lua]
  image: /assets/projects/obsidian-pdf-mirror.png
  image_alt: "Obsidian PDF Mirror: an Obsidian vault converted via pandoc and Typst into PDFs on an e-ink tablet"
  repo: https://github.com/schaefer-dev/obsidian_pdf_mirror
  summary: >-
    Mirrors an Obsidian vault into typeset PDFs for reading on an e-ink tablet,
    incrementally and in the background.
  description: |
    Obsidian is great for writing notes but less great for reading them on an e-ink tablet. This tool mirrors my entire Obsidian vault into a separate folder tree of nicely typeset PDFs that syncs to my tablet via Dropbox. Obsidian-specific syntax is preprocessed and converted through pandoc with a custom Lua filter into Typst, which produces the PDFs. Runs are incremental and only re-render notes whose content or embedded files changed, so an idle run takes about 0.1 seconds. Deterministic output ensures unchanged notes are never rewritten and re-uploaded, renames and deletions are followed, and a safeguard refuses to delete more than 30 percent of the mirror in one run. The tool runs unobtrusively in the background via launchd.

- id: lightroom-gps
  title: "Lightroom GPS Gap Repair"
  tags: [Python, ExifTool, XMP, CLI]
  image: /assets/projects/lightroom-gps.svg
  image_fit: contain
  image_alt: "Lightroom GPS Gap Repair: photos without GPS get coordinates from the nearest geotagged photo in time"
  repo: https://github.com/schaefer-dev/lightroom-gps-gap-extrapolation
  summary: >-
    Safety-first command-line tool that fills missing GPS data in a Lightroom
    library from the nearest geotagged photo.
  description: |
    My Sony camera takes its location from a paired phone, but whenever the camera is switched on or the connection drops, a handful of frames end up without GPS data. This command-line tool fills these gaps in a Lightroom Classic library by copying the coordinates of the temporally nearest geotagged photo. Since it operates on an irreplaceable photo library, the design is safety-first: RAW files are never modified, only XMP sidecars without any GPS data are written, every affected file is backed up and SHA-256 verified before a single change, and every run can be restored. Larger time gaps are flagged for manual review or skipped, and unsynced Lightroom sidecars are detected and abort the run before they could overwrite catalog metadata.

- id: photography-portfolio
  title: "Photography Portfolio"
  tags: [JavaScript, Jekyll, Cloudinary, CSS]
  image: https://res.cloudinary.com/dhateve93/image/upload/w_1000,h_500,c_fill,g_auto,q_80,f_auto/20260722-A1_01770_aqpgvf
  image_alt: "Kingfisher in Dillingen, Germany, from the photography portfolio"
  link: /photos
  link_text: "View the photos"
  summary: >-
    The photo section of this site: 4K images delivered fast through Cloudinary,
    with a custom lightbox and data saver mode.
  description: |
    The [photography section](/photos) of this website is designed to deliver high-resolution images quickly without bloating the repository. All images are hosted on Cloudinary and resized on demand: 800 pixel thumbnails for the gallery grid and up to 4K for the lightbox, with automatic WebP/JPEG format selection, progressive loading and lazy loading. A custom lightbox preloads neighbouring images for instant previous/next navigation, supports touch panning on mobile devices and shows a loading bar for large images. A persistent data saver mode lets visitors on slower connections switch the lightbox from 4K to 2.4K images. The galleries are generated automatically from simple per-year photo lists, which keeps adding new photos a one-line change.
